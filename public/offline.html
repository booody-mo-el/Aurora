<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#040814" />
  <title>Aurora — Offline</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 20%,rgba(46,230,197,.12),transparent 45%),radial-gradient(ellipse at 80% 80%,rgba(139,92,246,.14),transparent 45%),#040814;color:#f2f7ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center}
    main{max-width:420px;padding:32px;border:1px solid rgba(110,231,255,.18);border-radius:20px;background:rgba(11,19,41,.82);backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(0,0,0,.55)}
    .mark{font-size:42px;color:#2ee6c5;line-height:1;margin-bottom:8px;text-shadow:0 0 24px rgba(46,230,197,.5)}
    h1{font-size:24px;margin:8px 0 10px}
    p{color:#b4c5de;font-size:14px;line-height:1.6;margin:0 0 22px}
    button{border:0;border-radius:999px;padding:11px 22px;background:linear-gradient(120deg,#2ee6c5,#6ee7ff);color:#04101c;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark">◜</div>
    <h1>You’re offline</h1>
    <p>Aurora needs an internet connection to browse TMDB titles, sync your profile, or stream video. Cached app assets remain available.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
