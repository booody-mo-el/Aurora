<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071016" />
  <title>Aurora — Offline</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#071016;color:#f4f8f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center}
    main{max-width:420px;padding:32px;border:1px solid rgba(167,242,214,.18);border-radius:20px;background:linear-gradient(145deg,#102127,#081116)}
    .mark{font-size:42px;color:#79e3c3;line-height:1;margin-bottom:8px}
    h1{font-size:24px;margin:8px 0 10px}
    p{color:#9fb2ad;font-size:14px;line-height:1.6;margin:0 0 22px}
    button{border:0;border-radius:999px;padding:11px 22px;background:#81e4c1;color:#082018;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark">◜</div>
    <h1>You’re offline</h1>
    <p>Aurora needs an internet connection to browse TMDB titles, sync your profile, or stream video. Cached app assets remain available.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
